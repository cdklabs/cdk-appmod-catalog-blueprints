name: python-tests
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: pytest aggregation
        id: pytest_aggregation
        if: "!cancelled() && steps.setup_python.outcome == 'success'"
        run: |-
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest
          .venv/bin/python -m pytest
        working-directory: use-cases/document-processing/resources/aggregation
      - name: pytest cleanup
        id: pytest_cleanup
        if: "!cancelled() && steps.setup_python.outcome == 'success'"
        run: |-
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest
          .venv/bin/python -m pytest
        working-directory: use-cases/document-processing/resources/cleanup
      - name: pytest default-bedrock-invoke
        id: pytest_default-bedrock-invoke
        if: "!cancelled() && steps.setup_python.outcome == 'success'"
        run: |-
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest
          .venv/bin/python -m pytest
        working-directory: use-cases/document-processing/resources/default-bedrock-invoke
      - name: pytest pdf-chunking
        id: pytest_pdf-chunking
        if: "!cancelled() && steps.setup_python.outcome == 'success'"
        run: |-
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest
          .venv/bin/python -m pytest
        working-directory: use-cases/document-processing/resources/pdf-chunking
      - name: pytest interactive-agent-handler
        id: pytest_interactive-agent-handler
        if: "!cancelled() && steps.setup_python.outcome == 'success'"
        run: |-
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m pytest
        working-directory: use-cases/framework/agents/resources/interactive-agent-handler
      - name: pytest knowledge-base-tool
        id: pytest_knowledge-base-tool
        if: "!cancelled() && steps.setup_python.outcome == 'success'"
        run: |-
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pytest
          .venv/bin/python -m pytest
        working-directory: use-cases/framework/agents/resources/knowledge-base-tool
      - name: pytest mcp-appmod-catalog-blueprints
        id: pytest_mcp-appmod-catalog-blueprints
        if: "!cancelled() && steps.setup_python.outcome == 'success'"
        run: |-
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m pytest
        working-directory: mcp-appmod-catalog-blueprints
    timeout-minutes: 30
